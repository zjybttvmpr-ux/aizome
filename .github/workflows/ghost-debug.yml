name: Ghost debug
on:
  push:
    branches: [debug/ghost]
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install && npm install --no-save esbuild playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui/build.mjs
      - run: mkdir -p shots && node tests/ui/ghost.mjs > shots/out.txt 2>&1 || true
      - name: 結果をブランチに置く
        run: |
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan debug/ghost-out
          git rm -rf --cached . > /dev/null
          git add -f shots
          git commit -m "results" -q
          git push -f origin debug/ghost-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
