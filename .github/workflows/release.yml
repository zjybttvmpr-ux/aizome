# v から始まるタグ（例: v0.1.0）を push するか、Actions 画面の「Run workflow」で動きます。
# Windows / Mac / Linux のインストーラーを作って、GitHub のリリースに載せます。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: Mac
            platform: macos-latest
            args: "--target universal-apple-darwin"
          - name: Linux
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux 用のライブラリ
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 依存パッケージ
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Aizome v__VERSION__"
          releaseBody: |
            ダウンロードページから、お使いの OS のボタンを押してください。
            - Windows: `-setup.exe`
            - Mac: `.dmg`（Apple Silicon / Intel 共通）
            - Linux: `.AppImage` または `.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
