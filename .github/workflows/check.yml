# 型のチェックだけを手早く行う（リリースの前の確認用）
name: Check

on:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install
      - run: npx tsc --noEmit

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - run: npm run build
      - name: ConPTY を取ってくる
        shell: pwsh
        run: ./scripts/fetch-conpty.ps1
      - run: cargo check
        working-directory: src-tauri
