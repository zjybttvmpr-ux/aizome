[package]
name = "aizome"
version = "0.18.0"
description = "ローカルAIで補完する、拡張しやすい多言語コードエディタ"
edition = "2021"

[lib]
name = "aizome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
regex = "1"
base64 = "0.22"
arboard = { version = "3", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_System_Threading", "Win32_Foundation", "Win32_System_DataExchange"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
